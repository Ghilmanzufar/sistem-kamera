<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Kamera - Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="glass-container">
        <header style="display: flex; justify-content: space-between; align-items: center;">
            <div>
                <h1>Admin <span>Dashboard</span></h1>
            </div>
            <button class="btn-danger" onclick="keluarAdmin()"
                style="padding: 10px 20px; font-weight: bold;">Keluar</button>
        </header>

        <div class="nav-tabs">
            <a href="index.html" class="active">Live Dashboard</a>
            <a href="history_inspeksi.html">History Inspeksi</a>
            <a href="rules.html">Setting Rules</a>
            <a href="models.html">Model AI (.pt)</a>
            <a href="ng_history.html">History NG</a>
            <a href="users.html">Manajemen User</a>
            <a href="camera.html">Manajemen Kamera</a>
            <a href="sison_config.html">Konfigurasi Sison</a>
        </div>

        <main>
            <section class="card">
                <div class="card-header">
                    <h2>Live Transactions</h2>
                    <p style="color: rgba(255,255,255,0.6); font-size: 14px;">Auto-refresh setiap 3 detik...</p>
                </div>
                <div class="table-wrapper">
                    <table id="transactions-table">
                        <thead>
                            <tr>
                                <th>ID Trans</th>
                                <th>Part No</th>
                                <th>Unique No</th>
                                <th>Nama Part</th>
                                <th>Target</th>
                                <th>Selesai</th>
                                <th>Status</th>
                                <th>Waktu Mulai</th>
                                <th>Waktu Selesai</th>
                            </tr>
                        </thead>
                        <tbody id="transactions-body">
                            <!-- Data Transaksi diisi dari JS -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
    <script src="js/auth.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
