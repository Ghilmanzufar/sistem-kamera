<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Kamera - Admin Dashboard (History NG)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="glass-container">
        <header style="display: flex; justify-content: space-between; align-items: center;">
            <div>
                <h1>Admin <span>Dashboard</span></h1>
            </div>
            <button class="btn-danger" onclick="keluarAdmin()"
                style="padding: 10px 20px; font-weight: bold;">Keluar</button>
        </header>

        <div class="nav-tabs">
            <a href="index.html">Live Dashboard</a>
            <a href="history_inspeksi.html">History Inspeksi</a>
            <a href="rules.html">Setting Global Rule</a>
            <a href="models.html">Model AI (.pt)</a>
            <a href="ng_history.html" class="active">History NG</a>
            <a href="users.html">Manajemen User</a>
            <a href="camera.html">Manajemen Kamera</a>
            <a href="sison_config.html">Konfigurasi Sison</a>
        </div>

        <main>
            <section class="card">
                <div class="card-header">
                    <h2>Gallery NG (History Inspeksi)</h2>
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <input type="date" id="filter-date" style="padding: 5px 10px; font-size: 14px;">
                        <p style="color: rgba(255,255,255,0.6); font-size: 14px; margin: 0;">Auto-refresh</p>
                    </div>
                </div>
                <div id="ng-gallery" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; padding: 20px; max-height: 600px; overflow-y: auto;">
                    <!-- Diisi oleh JS -->
                </div>
            </section>
        </main>
    </div>

    <!-- Modal Detail NG -->
    <div id="ng-modal" class="modal hidden">
        <div class="modal-content glass-card" style="max-width: 600px; text-align: center;">
            <h3 id="modal-ng-title" style="margin-bottom: 15px;">Detail NG</h3>
            <img id="modal-ng-img" src="" style="max-width: 100%; max-height: 400px; border-radius: 8px; margin-bottom: 15px; border: 1px solid var(--glass-border);">
            <div style="text-align: left; background: rgba(0,0,0,0.2); padding: 15px; border-radius: 8px; margin-bottom: 15px;">
                <p><strong>Part Number:</strong> <span id="modal-ng-part"></span></p>
                <p><strong>Waktu:</strong> <span id="modal-ng-time"></span></p>
                <p><strong>Status:</strong> <span style="color: var(--danger);">NG</span></p>
            </div>
            <div class="modal-actions" style="justify-content: space-between;">
                <a id="btn-download" href="" download class="btn-primary" style="text-decoration: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; display: inline-block;">Download Gambar</a>
                <button type="button" id="btn-close-modal" class="btn-secondary">Tutup</button>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/ng_history.js"></script>
</body>
</html>
