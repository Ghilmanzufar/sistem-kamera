<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Kamera - Admin Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
        }
        .login-box {
            max-width: 440px;
            width: 100%;
            padding: 2.5rem;
            text-align: center;
            animation: fadeIn 0.4s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .login-header h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }
        .login-header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--text-main);
            font-size: 0.9rem;
        }
        .form-control {
            width: 100%;
            padding: 0.85rem 1rem;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            transition: all 0.2s;
        }
        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
            background: rgba(255, 255, 255, 0.12);
        }
        .btn-login {
            width: 100%;
            padding: 0.9rem;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1.05rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin-top: 0.5rem;
        }
        .btn-login:hover {
            background: var(--primary-hover);
        }
        .btn-login:active {
            transform: scale(0.98);
        }
        .btn-login:disabled {
            background: var(--text-muted);
            cursor: not-allowed;
        }
        .error-msg {
            color: var(--danger);
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 0.75rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            display: none;
            font-size: 0.9rem;
        }
        .ponytail-badge {
            margin-top: 2rem;
            font-size: 0.8rem;
            color: var(--text-muted);
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="glass-container login-box">
        <div class="login-header">
            <h1>Admin <span>Portal</span></h1>
            <p>Silakan masuk untuk mengelola sistem inspeksi</p>
        </div>

        <div id="error-box" class="error-msg"></div>

        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" class="form-control" placeholder="Masukkan username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">PIN / Password</label>
                <input type="password" id="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" id="btn-submit" class="btn-login">Masuk Dashboard</button>
        </form>

        <div class="ponytail-badge">
            ⚡ Powered by Ponytail Zero-Bloat Auth
        </div>
    </div>

    <script>
        // Jika sudah punya token, langsung lempar ke index
        if (localStorage.getItem('admin_token')) {
            window.location.href = 'index.html';
        }

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-submit');
            const errBox = document.getElementById('error-box');
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            btn.disabled = true;
            btn.textContent = 'Memvalidasi...';
            errBox.style.display = 'none';

            try {
                const res = await fetch('/api/admin-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();

                if (res.ok && data.token) {
                    localStorage.setItem('admin_token', data.token);
                    localStorage.setItem('user_role', data.role || 'pengawas');
                    localStorage.setItem('username', data.username || username);
                    window.location.href = 'index.html';
                } else {
                    errBox.textContent = data.detail || "Gagal masuk. Periksa kembali akun Anda!";
                    errBox.style.display = 'block';
                }
            } catch (error) {
                errBox.textContent = "Gagal terhubung ke server. Pastikan aplikasi kamera sedang berjalan.";
                errBox.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Masuk Dashboard';
            }
        }
    </script>
</body>
</html>
