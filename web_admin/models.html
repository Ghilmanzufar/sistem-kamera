<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Kamera - Admin Dashboard (Model AI)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="glass-container">
        <header style="display: flex; justify-content: space-between; align-items: center;">
            <div>
                <h1>Admin <span>Dashboard</span></h1>
            </div>
            <button class="btn-danger" onclick="keluarAdmin()"
                style="padding: 10px 20px; font-weight: bold;">Keluar</button>
        </header>

        <div class="nav-tabs">
            <a href="index.html">Live Dashboard</a>
            <a href="history_inspeksi.html">History Inspeksi</a>
            <a href="rules.html">Setting Rules</a>
            <a href="models.html" class="active">Model AI (.pt)</a>
            <a href="ng_history.html">History NG</a>
            <a href="users.html">Manajemen User</a>
            <a href="camera.html">Manajemen Kamera</a>
            <a href="sison_config.html">Konfigurasi Sison</a>
        </div>

        <main>
            <section class="card">
                <div class="card-header">
                    <h2>Model YOLO Terinstall</h2>
                    <button id="btn-add-model" class="btn-primary">+ Upload Model</button>
                </div>
                <div class="table-wrapper">
                    <table id="models-table">
                        <thead>
                            <tr>
                                <th>Part No (Nama Model)</th>
                                <th>Nama File</th>
                                <th>Ukuran (MB)</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="models-body">
                            <!-- Injected by JS -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <!-- Modal Form -->
    <div id="model-modal" class="modal hidden">
        <div class="modal-content glass-card" style="max-width: 500px;">
            <h3 id="modal-title">Upload / Replace Model (.pt)</h3>
            <form id="model-form">
                <div class="form-group">
                    <label>Part Number (Tanpa ekstensi)</label>
                    <input type="text" id="input-model-pno" placeholder="Contoh: 74231-0K550-00" required>
                </div>
                <div class="form-group" style="margin-top: 1rem;">
                    <label>File Model (.pt)</label>
                    <input type="file" id="input-model-file" accept=".pt" required style="background: rgba(0,0,0,0.5);">
                </div>

                <div class="modal-actions">
                    <button type="button" id="btn-cancel" class="btn-secondary">Batal</button>
                    <button type="submit" class="btn-primary">Upload</button>
                </div>
            </form>
        </div>
    </div>
    <div id="rename-modal" class="modal hidden">
        <div class="modal-content glass-card" style="max-width: 500px;">
            <h3 id="rename-modal-title">Edit Nama Model</h3>
            <form id="rename-form">
                <input type="hidden" id="input-rename-old-pno">
                <div class="form-group">
                    <label>Part Number Baru (Tanpa ekstensi)</label>
                    <input type="text" id="input-rename-new-pno" required>
                </div>
                <div class="modal-actions">
                    <button type="button" id="btn-rename-cancel" class="btn-secondary">Batal</button>
                    <button type="submit" class="btn-primary">Simpan</button>
                </div>
            </form>
        </div>
    </div>
    
    <script src="js/auth.js"></script>
    <script src="js/models.js"></script>
</body>
</html>
