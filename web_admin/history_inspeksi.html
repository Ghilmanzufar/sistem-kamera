<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Kamera - Admin Dashboard (History Inspeksi)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="glass-container">
        <header style="display: flex; justify-content: space-between; align-items: center;">
            <div>
                <h1>Admin <span>Dashboard</span></h1>
            </div>
            <button class="btn-danger" onclick="keluarAdmin()"
                style="padding: 10px 20px; font-weight: bold;">Keluar</button>
        </header>

        <div class="nav-tabs">
            <a href="index.html">Live Dashboard</a>
            <a href="history_inspeksi.html" class="active">History Inspeksi</a>
            <a href="rules.html">Setting Rules</a>
            <a href="models.html">Model AI (.pt)</a>
            <a href="ng_history.html">History NG</a>
            <a href="users.html">Manajemen User</a>
            <a href="camera.html">Manajemen Kamera</a>
            <a href="sison_config.html">Konfigurasi Sison</a>
        </div>

        <main>
            <section class="card">
                <div class="card-header">
                    <h2>History Transaksi Sison</h2>
                    <div style="display: flex; align-items: center; gap: 15px;">
                        <input type="date" id="filter-date" style="padding: 8px 12px; font-size: 14px; border-radius: 8px; border: 1px solid var(--glass-border); background: rgba(255,255,255,0.1); color: white;">
                        <button id="btn-export" class="btn-primary" style="padding: 8px 15px; font-weight: bold; background: #28a745;">📥 Export Excel (CSV)</button>
                    </div>
                </div>
                <div class="table-wrapper">
                    <table id="transactions-table">
                        <thead>
                            <tr>
                                <th>ID Transaksi</th>
                                <th>Part No</th>
                                <th>Part Name</th>
                                <th>Lot No</th>
                                <th>Unique No</th>
                                <th>Target Qty</th>
                                <th>Actual Qty</th>
                                <th>Status</th>
                                <th>Waktu Mulai</th>
                            </tr>
                        </thead>
                        <tbody id="transactions-body">
                            <!-- Diisi oleh JS -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/history_inspeksi.js"></script>
</body>
</html>
